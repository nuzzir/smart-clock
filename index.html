<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Screen Clock</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: "Segoe UI", Arial, sans-serif;
  width: 100vw;
  height: 100vh;
  overflow: hidden;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/*
MAIN CLOCK
Largest possible while staying on one line
This is now the main focal point
*/

#time {
  font-size: 18vw;
  font-weight: 300;
  line-height: 1;
  text-align: center;
  white-space: nowrap;
  letter-spacing: 1px;
}

/*
DATE
Smaller and clean underneath
*/

#date {
  margin-top: 20px;
  font-size: 3vw;
  opacity: 0.9;
  text-align: center;
}

/*
Tablet adjustments
*/

@media (max-width: 1000px) {
  #time {
    font-size: 20vw;
  }

  #date {
    font-size: 4.5vw;
  }
}
</style>
</head>

<body>

<div id="time"></div>
<div id="date"></div>

<script>
function updateTime() {
  const now = new Date();

  let hours = now.getHours();
  const minutes = now.getMinutes().toString().padStart(2, "0");
  const ampm = hours >= 12 ? "PM" : "AM";

  hours = hours % 12;
  hours = hours ? hours : 12;

  document.getElementById("time").innerHTML =
    `${hours}:${minutes} ${ampm}`;

  document.getElementById("date").innerHTML =
    now.toLocaleDateString(undefined, {
      weekday: "long",
      month: "long",
      day: "numeric"
    });
}

setInterval(updateTime, 1000);
updateTime();
</script>

</body>
</html>
